name: 🔄 Update Pinned Repos

on:
  schedule:
    - cron: "0 0 * * *"   # setiap hari jam 00:00 UTC (07:00 WIB)
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update-readme:
    name: Fetch pinned repos & update README
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 🔍 Fetch pinned repos & update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_pinned_repos.py

      - name: 🔎 Show git diff (debug)
        run: git diff README.md

      - name: 📝 Commit & push changes (if any)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "ℹ️ README is already up to date — nothing to commit."
          else
            echo "✅ Changes detected, committing..."
            git commit -m "chore(auto): sync pinned repos [skip ci]"
            git push
            echo "🚀 Pushed!"
          fi
